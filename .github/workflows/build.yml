name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Source Code
      run: |
        unzip *.zip -d .
        rm -f *.zip

    - name: Fix Coding Error (Import Calendar)
      run: |
        # MonitorService.kt च्या सुरुवातीला missing Calendar लायब्ररी आपोआप जोडणे
        FILE_PATH="app/src/main/java/com/nightmonitor/app/MonitorService.kt"
        if [ -f "$FILE_PATH" ]; then
          echo "Adding missing Calendar import..."
          # फाईलच्या २ ऱ्या ओळीवर import java.util.Calendar जोडणे
          sed -i '2i import java.util.Calendar' "$FILE_PATH"
        fi

    - name: Fix and Force Gradle Version
      run: |
        rm -f gradlew gradlew.bat
        rm -rf gradle/wrapper
        gradle wrapper --gradle-version 8.2 --distribution-type all

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
