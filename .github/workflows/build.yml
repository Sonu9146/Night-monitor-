name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip and Smart Move Files
      run: |
        unzip NightMonitor-v8-model-ready.zip -d extracted_files
        
        # gradlew फाईल नेमकी कोणत्या फोल्डरमध्ये आहे ते शोधणे
        GRADLEW_DIR=$(find extracted_files -name "gradlew" -exec dirname {} \;)
        
        if [ -n "$GRADLEW_DIR" ]; then
          echo "Found gradlew in: $GRADLEW_DIR"
          # त्या फोल्डरमधील सर्व फाईल्स मुख्य बाहेरच्या डिरेक्टरीमध्ये आणणे
          mv $GRADLEW_DIR/* . 2>/dev/null || true
          mv $GRADLEW_DIR/.* . 2>/dev/null || true
        else
          echo "gradlew not found in zip structure!"
          exit 1
        fi
        rm -rf extracted_files
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
